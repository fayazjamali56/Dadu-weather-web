<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="nav-logo" href="index.html"><span class="mark"></span> Dadu Weather</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>

      <a class="btn btn-primary" href="login.html">Login</a>

    <button class="hamburger" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>

    <a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a>
    <a href="register.html">Register</a><a href="login.html">Login</a>
  </div>
</header>
<div class="ajrak-strip"></div>

<main class="form-page">
  <h1>Contact us</h1>
  <p>Questions, corrections, or a town we should add? Send a message below.</p>

  <div class="form-card">
    <div class="ajrak-strip"></div>
    <div class="form-card-body">
      <div class="form-status" data-form-status></div>
      <form id="contact-form" novalidate>
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" />
          <p class="form-error" id="err-name"></p>
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
          <p class="form-error" id="err-email"></p>
        </div>
        <div class="form-row">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" name="phone" />
        </div>
        <div class="form-row">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" />
          <p class="form-error" id="err-subject"></p>
        </div>
        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" name="message"></textarea>
          <p class="form-error" id="err-message"></p>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send message</button>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container"><p class="footer-fine">© <span data-year></span> Dadu Weather. Created by Fayaz Jamali.</p></div>
</footer>
<script src="assets/js/locations.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>initContactForm(document.getElementById("contact-form"));</script>
</body>
</html>
